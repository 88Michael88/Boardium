# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main","dev","feat-administration-panel" ]
  pull_request:
    branches: [ "main","dev" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    - name: Restore dependencies
      run: dotnet restore Boardium/Boardium.sln
    - name: Build
      run: dotnet build Boardium/Boardium.sln --no-restore
    - name: Test
      run: dotnet test Boardium/BasicUnitTests.sln --no-build --verbosity normal